[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "opendm"
version = "1.0.0"
description = "Free, open-source multi-connection download manager"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.gui-scripts]
opendm = "opendm.__main__:main"

[tool.setuptools]
packages = ["opendm"]
