<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#14161b; --panel:#1b1e25; --field:#232731; --border:#2e3340; --text:#e7e9ee; --muted:#8b93a3; --accent:#3b82f6; --green:#22c55e; --red:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; width:300px; background:var(--bg); color:var(--text); font:13px "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--panel); }
  header img { width:28px; height:28px; }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  #status { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--muted); }
  .dot.on { background:var(--green); } .dot.off { background:var(--red); }
  main { padding:14px 16px; display:grid; gap:12px; }
  label.row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .hint { color:var(--muted); font-size:11px; margin-top:2px; }
  input[type=number], input[type=text] { width:100%; background:var(--field); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:6px 8px; font:inherit; }
  input[type=number] { width:90px; }
  input:focus { outline:none; border-color:var(--accent); }
  .switch { position:relative; width:38px; height:22px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .slider { position:absolute; inset:0; background:var(--field); border-radius:22px; transition:.15s; cursor:pointer; }
  .slider:before { content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:white; border-radius:50%; transition:.15s; }
  .switch input:checked + .slider { background:var(--accent); }
  .switch input:checked + .slider:before { transform:translateX(16px); }
  button { width:100%; background:var(--accent); color:white; border:0; border-radius:6px; padding:9px; font:600 13px inherit; font-family:inherit; cursor:pointer; }
  button:hover { filter:brightness(1.1); }
  #msg { font-size:12px; color:var(--muted); min-height:16px; }
  .sect { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  #videoList { display:grid; gap:4px; }
  .vid { display:flex; justify-content:space-between; align-items:center; background:var(--field); color:var(--text);
         border:0; border-radius:6px; padding:8px 10px; font:inherit; cursor:pointer; text-align:left; width:100%; }
  .vid:hover:not([disabled]) { background:var(--accent); }
  .vid[disabled] { color:var(--muted); cursor:default; }
  .vid span { color:var(--muted); font-size:12px; }
  .vid:hover:not([disabled]) span { color:#e8eefc; }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  details[open] { display:grid; gap:10px; }
  #perm { display:none; background:#2a2412; border:1px solid #6b5313; border-radius:8px; padding:10px 12px; gap:8px; }
  #perm.show { display:grid; }
  #perm p { margin:0; font-size:12px; color:#f3d48a; }
  body.tab { width:auto; max-width:420px; margin:40px auto; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
</style>
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="">
  <div>
    <h1>OpenDM</h1>
    <div id="status"><span class="dot" id="dot"></span><span id="statusText">Checking…</span></div>
  </div>
</header>
<main>
  <div id="perm">
    <p>OpenDM needs permission to talk to the app on your computer and to pass along site cookies so logged-in downloads work.</p>
    <button id="grant">Grant access</button>
  </div>
  <label class="row">
    <div>
      <div>Catch browser downloads</div>
      <div class="hint">Send downloads to OpenDM when it's running</div>
    </div>
    <span class="switch"><input type="checkbox" id="enabled"><span class="slider"></span></span>
  </label>

  <label class="row">
    <div>
      <div>"Download this video" button</div>
      <div class="hint">Shows on videos when you hover them</div>
    </div>
    <span class="switch"><input type="checkbox" id="showVideoButton"><span class="slider"></span></span>
  </label>

  <section id="videos" hidden>
    <div class="sect">Videos on this page</div>
    <div id="videoList"></div>
  </section>

  <button id="grab">Download all file links on this page</button>
  <div id="msg"></div>

  <details>
    <summary>Advanced</summary>
    <label class="row">Ignore files smaller than (KB) <input type="number" id="minSizeKB" min="0"></label>
    <div>
      <div>Let the browser handle these extensions</div>
      <input type="text" id="skipExtensions" placeholder="e.g. pdf, jpg, torrent">
    </div>
    <label class="row">App port <input type="number" id="port" min="1024" max="65535"></label>
  </details>
</main>
<script src="popup.js"></script>
</body>
</html>
